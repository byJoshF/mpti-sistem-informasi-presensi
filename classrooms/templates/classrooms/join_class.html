<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabung Kelas</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 550px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .back {
            color: #2563eb;
            text-decoration: none;
            margin-left: 12px;
        }

        .errorlist {
            color: #dc2626;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Gabung Kelas</h1>
        <p>Masukkan kode gabung yang diberikan oleh dosen.</p>

        <form method="POST">
            {% csrf_token %}

            {{ form.non_field_errors }}

            <p>
                {{ form.join_code.label_tag }}
                {{ form.join_code }}
                {{ form.join_code.errors }}
            </p>

            <button type="submit">Gabung Kelas</button>

            <a href="{% url 'classrooms:student_classroom_list' %}" class="back">
                Kembali
            </a>
        </form>

    </div>
</body>
</html>
