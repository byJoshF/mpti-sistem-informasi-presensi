
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ganti Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 35px 16px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 10px;
        }

        h1 { color: #1f2937; }

        .description {
            color: #666;
            font-size: 14px;
        }

        form p { margin-bottom: 18px; }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .helptext {
            display: block;
            color: #777;
            font-size: 12px;
            margin-top: 6px;
        }

        .success {
            background: #e2f7ee;
            color: #16835c;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 18px;
        }

        .errorlist {
            color: #b42318;
            font-size: 13px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            display: inline-block;
            margin-top: 18px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Ganti Password</h1>

        <p class="description">
            Masukkan password lama dan buat password baru.
        </p>

        {% if success %}
            <div class="success">
                Password berhasil diperbarui.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Simpan Password Baru</button>
        </form>

        <a href="{% url 'accounts:profile' %}">
            Kembali ke Profil
        </a>
    </div>
</body>
</html>
