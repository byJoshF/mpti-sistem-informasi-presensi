
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mahasiswa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 35px 16px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 28px;
            border-radius: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,.08);
        }

        h1 {
            margin-top: 0;
            color: #1f2937;
        }

        .description {
            color: #666;
            font-size: 14px;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .readonly {
            background: #eee;
            color: #666;
            caret-color: transparent;
            cursor: text;
            user-select: text;
        }

        .field {
            margin-bottom: 18px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .success {
            padding: 12px;
            margin-bottom: 18px;
            background: #e2f7ee;
            color: #16835c;
            border-radius: 6px;
        }

        .errorlist {
            color: #b42318;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Profil Mahasiswa</h1>
        <p class="description">
            Periksa dan perbarui informasi akun kamu.
        </p>

        {% if success %}
            <div class="success">
                Profil berhasil diperbarui.
            </div>
        {% endif %}

        <div class="field">
            <label>NIM</label>
            <input
                type="text"
                value="{{ user.username }}"
                class="readonly"
                readonly
            >
        </div>

        <form method="post">
            {% csrf_token %}

            {{ form.non_field_errors }}

            {% for field in form %}
                <div class="field">
                    {{ field.label_tag }}
                    {{ field }}
                    {{ field.errors }}
                </div>
            {% endfor %}

            <button type="submit">Simpan Perubahan</button>
        </form>
        <p>
            <a href="{% url 'accounts:password_change' %}">
                Ganti Password
            </a>
        </p>
    </div>
</body>
</html>
